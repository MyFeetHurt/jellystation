# Development stack on the VM tvstack-dev (192.168.0.137): tuners come from the production Mirakurun (read-only use, 2 slots).
services:
  jellystation:
    build: ..
    image: jellystation:dev
    container_name: jellystation
    restart: unless-stopped
    cap_add:
      - SYS_NICE # Mirakurun raises its own priority
    environment:
      JELLYSTATION_REMOTE_MIRAKURUN: 192.168.0.118:40772
      JELLYSTATION_REMOTE_TUNERS: "2"
      # production EPGStation recordings win tuners over dev ones
      JELLYSTATION_EPGSTATION_REC_PRIORITY: "1"
      JELLYSTATION_EPGSTATION_CONFLICT_PRIORITY: "0"
      JELLYSTATION_JELLYFIN_PASSWORD: jellystation-dev
      JELLYSTATION_SYNC_INTERVAL: "120"
      # no logo collection: it would tune the remote tuners
      LOGO_DATA_INTERVAL: "999999999"
    ports:
      - "8096:8096"
      - "8888:8888"
      - "40772:40772"
    volumes:
      - ./data/config:/config
      - ./data/cache:/cache
      - ./data/media:/media
