# Mirakurun tuners for local devices. Enable the ones you have (isDisabled: false) and pass the devices to the
# container (see README). recisdb descrambles with the B-CAS card through pcscd (card reader passed as /dev/bus/usb).
# Then scan channels: curl -X PUT "http://<host>:40772/api/config/channels/scan?type=GR&setDisabledOnAdd=false"
#
# Without local tuners, set TVSTACK_REMOTE_MIRAKURUN=host:port before the first start to use another Mirakurun.

# Earthsoft PT3 (chardev driver: /dev/pt3video*)
- name: PT3-S1
  types: [BS, CS]
  command: recisdb tune --device /dev/pt3video0 --channel <channel> -
  isDisabled: true
- name: PT3-S2
  types: [BS, CS]
  command: recisdb tune --device /dev/pt3video1 --channel <channel> -
  isDisabled: true
- name: PT3-T1
  types: [GR]
  command: recisdb tune --device /dev/pt3video2 --channel T<channel> -
  isDisabled: true
- name: PT3-T2
  types: [GR]
  command: recisdb tune --device /dev/pt3video3 --channel T<channel> -
  isDisabled: true

# PLEX PX-Q3U4 / PX-W3U4 / PX-Q3PE4 / PX-W3PE4 (px4_drv: /dev/px4video*; order S, S, T, T per tuner pair)
- name: PX4-S1
  types: [BS, CS]
  command: recisdb tune --device /dev/px4video0 --channel <channel> -
  isDisabled: true
- name: PX4-S2
  types: [BS, CS]
  command: recisdb tune --device /dev/px4video1 --channel <channel> -
  isDisabled: true
- name: PX4-T1
  types: [GR]
  command: recisdb tune --device /dev/px4video2 --channel T<channel> -
  isDisabled: true
- name: PX4-T2
  types: [GR]
  command: recisdb tune --device /dev/px4video3 --channel T<channel> -
  isDisabled: true
